[project]
name = "enerfabric-backend"
version = "0.1.0"
description = "EnerFabric coordination backend: asset registry, telemetry, intent/policy evaluation, coordination engine, and simulation."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-autogenerated migration scripts are boilerplate we don't hand-edit
# for style; env.py (hand-written/customized) is still linted normally.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
