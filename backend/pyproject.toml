[project]
name = "enerfabric-backend"
version = "0.1.0"
description = "EnerFabric coordination backend: asset registry, telemetry, intent/policy evaluation, coordination engine, and simulation."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
